name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sensor
          POSTGRES_PASSWORD: sensor
          POSTGRES_DB: sensorhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sensor -d sensorhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # throwaway values for the CI database; the real secrets never leave .env
      API_KEY: ci-key
      DATABASE_URL: postgresql+psycopg://sensor:sensor@localhost:5432/sensorhub_test
      TEST_DATABASE_URL: postgresql+psycopg://sensor:sensor@localhost:5432/sensorhub_test
      REDIS_URL: redis://localhost:6379/0      # never contacted: the tests use a fake cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t sensor-hub .

  firmware:
    name: Firmware compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build with the example secrets
        working-directory: firmware
        run: |
          cp include/secrets.example.h include/secrets.h
          pio run
