services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sensorhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor -d sensorhub"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  api:
    build: .
    env_file: .env                                # API key, Telegram etc. at runtime, never baked into the image
    environment:                                  # overrides .env: inside the network the hosts are the service names
      DATABASE_URL: postgresql+psycopg://sensor:${DB_PASSWORD}@db:5432/sensorhub
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"                               # all interfaces (not 127.0.0.1): the ESP32 posts over Wi-Fi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:                                         # sends the notifications (Telegram), same image, other command
    build: .
    command: ["python", "-m", "sensor_hub.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sensor:${DB_PASSWORD}@db:5432/sensorhub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started               # api runs the migrations first
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.6.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # no login: every visitor is an anonymous viewer
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer          # read-only in Grafana (dashboards come from git anyway)
      GF_AUTH_DISABLE_LOGIN_FORM: "true"          # hide the login page
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sensor-hub.json   # landing page = our dashboard
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}     # read-only role, created by scripts/create_grafana_role.sh
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
