services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sensorhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor -d sensorhub"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  grafana:
    image: grafana/grafana-oss:11.6.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # no login: every visitor is an anonymous viewer
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer          # read-only in Grafana (dashboards come from git anyway)
      GF_AUTH_DISABLE_LOGIN_FORM: "true"          # hide the login page
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sensor-hub.json   # landing page = our dashboard
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}     # read-only role, created by scripts/create_grafana_role.sh
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  grafana-data:
