# Grafana reads Postgres directly over the Compose network (service name `db`).
apiVersion: 1
datasources:
  - name: sensorhub
    uid: sensorhub-pg
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana_reader                # read-only role (SELECT only, no last_error)
    isDefault: true
    jsonData:
      database: sensorhub
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}  # from the container environment, set by compose from .env
